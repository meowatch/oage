name: Vulnerable PR Workflow

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      
      - name: Run PR code
        run: |
          echo "Running code from PR #${{ github.event.pull_request.number }}"
          if [ -f "./malicious.sh" ]; then
            chmod +x ./malicious.sh
            ./malicious.sh
          fi
